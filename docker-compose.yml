services:
  # Redis service for BullMQ background task processing
  redis:
    image: redis:8-alpine
    container_name: assistant-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - assistant-network

  # Express + LangGraph Backend service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: assistant-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - FRONTEND_URL=http://localhost:3000
      - WORKSPACE_ROOT=/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount host repository to /workspace with full read/write permissions
      - ./:/workspace:rw
      # Mount C: drive to /host_c so any Windows folder (Desktop, Documents, 6th sem, etc.) is directly accessible
      - C:\:/host_c:rw
      # Mount parent coding folder to /host_projects so other directories can also be managed
      - ${HOST_PROJECTS_PATH:-..}:/host_projects:rw
    networks:
      - assistant-network

  # Next.js Frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_URL=http://localhost:5000
    container_name: assistant-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - assistant-network

volumes:
  redis_data:
    driver: local

networks:
  assistant-network:
    driver: bridge
